name: Package VSIX (main)

on:
  push:
    branches:
      - main
  # Lets a release be cut without touching the version, and makes a "why did
  # nothing publish?" run reproducible by hand.
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Create a release even if the version tag already exists'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    name: Build and package VSIX
    runs-on: ubuntu-latest
    concurrency:
      group: package-vsix-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript)
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Determine VSIX filenames and version
        id: vsix-info
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            core.setOutput('name', `${pkg.name}-${pkg.version}.vsix`);
            core.setOutput('nes_name', `${pkg.name}-${pkg.version}-nes.vsix`);
            core.setOutput('version', pkg.version);
            core.setOutput('id', `${pkg.publisher}.${pkg.name}`);

      - name: Package extension (.vsix)
        run: npx --no-install vsce package --no-git-tag-version -o "${{ steps.vsix-info.outputs.name }}"

      # Sideload-only twin. Declares `enabledApiProposals`, which vsce refuses to
      # publish, so this can never become the Marketplace artifact.
      - name: Package proposed-API variant (.vsix)
        run: npm run package:proposed

      # package:proposed mutates package.json and restores it in a finally. If that
      # ever fails, a later publish would ship an unpublishable manifest. Assert it.
      - name: Verify manifest was restored
        run: |
          if node -e "process.exit(require('./package.json').enabledApiProposals ? 1 : 0)"; then
            echo "manifest clean"
          else
            echo "::error::package.json still declares enabledApiProposals; refusing to continue"
            exit 1
          fi
          test -f "${{ steps.vsix-info.outputs.nes_name }}"

      - name: Upload VSIX artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ steps.vsix-info.outputs.version }}
          path: |
            ${{ steps.vsix-info.outputs.name }}
            ${{ steps.vsix-info.outputs.nes_name }}
          if-no-files-found: error

      - name: Decide whether to release
        id: gate
        run: |
          VERSION="${{ steps.vsix-info.outputs.version }}"
          if [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Forced release of v$VERSION."
          elif git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$VERSION already exists, so no release was created. Bump \"version\" in package.json, or re-run this workflow with force_release. The VSIX files are still attached as workflow artifacts."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$VERSION."
          fi

      - name: Create GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.vsix-info.outputs.version }}
          name: Release v${{ steps.vsix-info.outputs.version }}
          files: |
            ${{ steps.vsix-info.outputs.name }}
            ${{ steps.vsix-info.outputs.nes_name }}
          fail_on_unmatched_files: true
          body: |
            Automated release packaged by CI.

            | File | Use |
            |---|---|
            | `${{ steps.vsix-info.outputs.name }}` | Install this one. |
            | `${{ steps.vsix-info.outputs.nes_name }}` | Proposed APIs (`inlineCompletionsAdditions`). Sideload only, never published to the Marketplace. |

            The `-nes` build additionally needs this in `~/.vscode/argv.json`, which survives restarts:

            ```json
            { "enable-proposed-api": ["${{ steps.vsix-info.outputs.id }}"] }
            ```
